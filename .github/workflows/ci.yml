name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw -B verify
      - name: Pilot results reproduce
        run: scripts/check-results.sh
      - name: Reference solutions pass their tests
        run: experiments/agent-demo/scripts/check-reference-solutions.sh
